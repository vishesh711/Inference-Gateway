# Multiple backend configuration
backends:
  - id: primary
    url: http://localhost:8080
    model: tinyllama
    capacity: 8
    timeout: 120s
    max_retries: 1

# Legacy single engine config (for backward compatibility)
# If backends array is empty, this will be used
engine:
  url: http://localhost:8080
  timeout: 120s
  max_retries: 1

scheduler:
  max_in_flight: 8
  queue_size: 100
  # Token-aware admission control
  token_capacity: 20000          # Total token budget (20K tokens)
  use_token_scheduling: true     # Enable token-based scheduling
  embed_max_batch: 32
  embed_max_wait_ms: 20

cache:
  enabled: false  # Disable for benchmarking
  max_entries: 1000
  ttl: 300s

cost:
  gpu_hourly_rate: 0.00  # 0 for local CPU; set for GPU runs

server:
  port: 8000
  shutdown_timeout: 30s

health:
  check_interval: 10s
  check_timeout: 5s
