[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-gateway"
version = "0.1.0"
description = "Inference gateway with admission control, batching, caching, and observability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.21.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.32.0"
]

[project.optional-dependencies]
test = [
  "asgi-lifespan>=2.1.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
